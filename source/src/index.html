<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Vanguard — Modern Operations</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root { --acc:#e8c15a; --acc2:#9fd36b; --txt:#e9ecef; --dim:#9aa3ab; --bgp:rgba(12,16,20,.78); }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#000; overflow:hidden; font-family: "Segoe UI", "Bahnschrift", "Roboto Condensed", Arial, sans-serif; color:var(--txt); user-select:none; }
body.nocursor { cursor:none; }
#game { position:fixed; inset:0; display:block; }
#boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; letter-spacing:4px; color:#888; background:#050607; z-index:50; }

/* ---------------- menus ---------------- */
#menu { position:fixed; inset:0; z-index:20; display:flex; }
#menu .bg { position:absolute; inset:0; background:
  radial-gradient(ellipse at 70% 30%, rgba(232,193,90,.10), transparent 55%),
  radial-gradient(ellipse at 20% 80%, rgba(80,120,90,.18), transparent 60%),
  linear-gradient(160deg,#0d1114 0%,#151b1f 45%,#0a0c0e 100%); }
#menu .bg::after { content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); pointer-events:none; }
#menu.pauseS .bg, #menu.resultsS .bg { background: rgba(5,7,9,.72); backdrop-filter: blur(6px); }
#menu .screen { position:relative; flex:1; padding:48px 64px; overflow:auto; }
.title { margin-top:9vh; }
.title .t1 { font-size:76px; font-weight:800; letter-spacing:10px; line-height:1; background:linear-gradient(180deg,#fff, #bfc6cc); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow: 0 0 40px rgba(232,193,90,.12); }
.title .t2 { font-size:18px; letter-spacing:14px; color:var(--acc); margin-top:10px; }
.mainnav { display:flex; flex-direction:column; gap:10px; margin-top:7vh; width:340px; }
button { font:inherit; color:var(--txt); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12); padding:13px 20px; font-size:16px; letter-spacing:3px; text-align:left; cursor:pointer; transition: all .12s; clip-path: polygon(0 0, 100% 0, 100% 70%, 96% 100%, 0 100%); }
button:hover { background:rgba(232,193,90,.18); border-color:var(--acc); padding-left:28px; }
button.primary { background:linear-gradient(90deg, rgba(232,193,90,.9), rgba(232,193,90,.65)); color:#111; font-weight:700; border-color:var(--acc); }
button.primary:hover { background:var(--acc); }
button.small { padding:4px 10px; font-size:12px; margin-left:10px; display:inline-block; }
.foot { position:absolute; bottom:24px; left:64px; color:#5d666e; font-size:12px; letter-spacing:2px; }
.hdr { display:flex; align-items:center; gap:22px; margin-bottom:26px; }
.hdr h1 { margin:0; font-size:34px; letter-spacing:8px; font-weight:800; }
.hdr .back { padding:8px 14px; font-size:13px; }
.cols { display:grid; grid-template-columns: 380px 1fr; gap:36px; }
.list { display:flex; flex-direction:column; gap:8px; }
.card { display:flex; gap:16px; align-items:center; padding:14px 16px; background:rgba(255,255,255,.04); border-left:3px solid transparent; cursor:pointer; position:relative; }
.card:hover { background:rgba(255,255,255,.08); }
.card.sel { border-left-color:var(--acc); background:rgba(232,193,90,.12); }
.card .num { font-size:28px; font-weight:800; color:#56606a; width:44px; }
.card .cn { font-weight:700; letter-spacing:2px; } .card .cs { font-size:12px; color:var(--dim); margin-top:3px; }
.card .done { position:absolute; right:12px; color:var(--acc2); font-size:12px; }
.brief { background:var(--bgp); padding:30px 34px; border:1px solid rgba(255,255,255,.07); max-width:760px; }
.brief .op, .loading .op, .results .op { font-size:30px; font-weight:800; letter-spacing:5px; }
.brief .loc, .loading .loc { color:var(--acc); letter-spacing:3px; font-size:13px; margin:6px 0 16px; }
.brief p { line-height:1.6; color:#cfd5da; }
.objs { color:#cfd5da; line-height:1.8; padding-left:18px; } .objs li::marker { color:var(--acc); }
.lbl { font-size:12px; letter-spacing:3px; color:var(--dim); margin:20px 0 8px; }
.opts { display:flex; gap:8px; flex-wrap:wrap; }
.opt { padding:9px 14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); cursor:pointer; font-size:14px; letter-spacing:1px; }
.opt:hover { border-color:rgba(232,193,90,.6); }
.opt.sel { background:rgba(232,193,90,.2); border-color:var(--acc); color:#fff; }
.lo { margin:22px 0; color:#cfd5da; }
.deploy { margin-top:6px; width:260px; font-size:18px; }
.lgrid { display:grid; grid-template-columns: repeat(3, 1fr); gap:26px; }
.lgrid section { background:var(--bgp); padding:20px 22px; border:1px solid rgba(255,255,255,.07); }
.lgrid h2 { margin:0 0 12px; font-size:16px; letter-spacing:5px; color:var(--acc); } .lgrid h2 small { color:var(--dim); font-size:11px; letter-spacing:1px; }
.lgrid h3 { font-size:12px; letter-spacing:3px; color:var(--dim); margin:18px 0 8px; }
.wl { display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
.opt.w b, .opt.p b { display:block; font-size:14px; } .opt.w small, .opt.p small { color:var(--dim); font-size:11px; }
.desc { margin:12px 0; color:#bfc6cc; font-size:13px; min-height:34px; }
.stat { display:flex; align-items:center; gap:10px; font-size:11px; letter-spacing:2px; color:var(--dim); margin:5px 0; }
.stat span { width:90px; } .stat div { flex:1; height:6px; background:rgba(255,255,255,.08); } .stat i { display:block; height:100%; background:linear-gradient(90deg,var(--acc),#fff3c4); }
.stat b { color:#fff; font-size:13px; }
.attrow { display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin:6px 0; } .attrow span { width:100%; font-size:10px; letter-spacing:2px; color:#6f7881; }
.attrow .opt { padding:6px 9px; font-size:12px; }
.perks { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.settings { max-width:760px; background:var(--bgp); padding:24px 30px; }
.settings h2 { font-size:14px; letter-spacing:5px; color:var(--acc); margin:18px 0 10px; }
.srow { display:flex; align-items:center; gap:16px; margin:10px 0; } .srow > span { width:200px; color:#cfd5da; } .srow b { width:60px; }
.srow input[type=range] { flex:1; accent-color: var(--acc); }
.note { color:var(--dim); font-size:12px; }
.controls { display:grid; grid-template-columns: 1fr 1fr; gap:8px 40px; max-width:900px; background:var(--bgp); padding:24px 30px; }
.crow { display:flex; gap:12px; align-items:center; } .crow > span { flex:1; color:#cfd5da; }
.bind { min-width:120px; text-align:center; padding:7px 10px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); border-bottom-width:3px; cursor:pointer; font-size:13px; }
.bind:hover { border-color:var(--acc); } .bind.wait { background:rgba(232,193,90,.25); border-color:var(--acc); animation: pulse 1s infinite; }
button small { display:block; font-size:11px; letter-spacing:1px; font-weight:400; opacity:.75; margin-top:3px; text-transform:none; } kbd { min-width:170px; display:inline-block; padding:6px 10px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); border-bottom-width:3px; font-family:inherit; font-size:13px; letter-spacing:1px; }
.loading { max-width:820px; margin:16vh auto 0; }
.loading .briefing { color:#cfd5da; line-height:1.7; font-size:16px; }
.pbar { height:4px; background:rgba(255,255,255,.1); margin:40px 0 10px; } .pbar div { height:100%; width:0; background:var(--acc); transition:width .2s; }
.pstat { color:var(--dim); letter-spacing:2px; font-size:13px; min-height:52px; } .pstat .go { margin-top:10px; font-size:18px; width:320px; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 24px rgba(232,193,90,.5); } }
.tip { margin-top:40px; color:#7d868e; font-size:13px; letter-spacing:1px; }
.pause { display:flex; flex-direction:column; gap:10px; width:360px; margin:16vh auto 0; } .pause h1 { letter-spacing:10px; margin:0 0 16px; }
.results { text-align:center; margin-top:12vh; } .results h1 { font-size:58px; letter-spacing:12px; margin:0 0 10px; }
.results.win h1 { color:var(--acc); } .results.lose h1 { color:#e05a4f; } .reason { color:#cfd5da; }
.rs { display:flex; justify-content:center; gap:46px; margin:40px 0; } .rs b { display:block; font-size:36px; } .rs span { color:var(--dim); font-size:12px; letter-spacing:3px; }
.btns { display:flex; justify-content:center; gap:12px; } .btns button { min-width:200px; text-align:center; }

/* ---------------- HUD ---------------- */
#hud { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
#xhair { position:absolute; left:50%; top:50%; --s:8px; transition: opacity .1s; }
#xhair i { position:absolute; background:#fff; box-shadow:0 0 2px #000; }
#xhair .t, #xhair .b { width:2px; height:9px; left:-1px; } #xhair .t { top:calc(-1 * var(--s) - 9px); } #xhair .b { top:var(--s); }
#xhair .l, #xhair .r { height:2px; width:9px; top:-1px; } #xhair .l { left:calc(-1 * var(--s) - 9px); } #xhair .r { left:var(--s); }
#xhair b { position:absolute; width:2px; height:2px; left:-1px; top:-1px; background:#fff; }
#hitm { position:absolute; left:50%; top:50%; opacity:0; } #hitm.on { opacity:1; }
#hitm i { position:absolute; width:12px; height:2px; background:#fff; box-shadow: 0 0 2px #000; }
#hitm i:nth-child(1){ transform:translate(-18px,-12px) rotate(45deg);} #hitm i:nth-child(2){ transform:translate(6px,-12px) rotate(-45deg);} #hitm i:nth-child(3){ transform:translate(-18px,10px) rotate(-45deg);} #hitm i:nth-child(4){ transform:translate(6px,10px) rotate(45deg);}
#hitm.kill i { background:#ff3b30; } #hitm.head i { background:#ffd34d; }
#dmgdirs .dd { position:absolute; left:50%; top:50%; width:240px; height:240px; border-radius:50%; border-top:6px solid rgba(220,30,20,.85); filter: blur(1px); mask: linear-gradient(90deg, transparent 30%, #000 45%, #000 55%, transparent 70%); -webkit-mask: linear-gradient(90deg, transparent 30%, #000 45%, #000 55%, transparent 70%); }
#compass { position:absolute; top:16px; left:50%; width:600px; margin-left:-300px; height:28px; overflow:hidden; mask: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); -webkit-mask: linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent); }
#compass .strip { position:absolute; left:300px; top:0; height:100%; }
#compass .strip span { position:absolute; transform:translateX(-50%); font-size:10px; color:rgba(255,255,255,.55); top:6px; }
#compass .strip span.lb { font-size:15px; font-weight:700; color:#fff; top:3px; }
#compass .obj { position:absolute; left:300px; top:2px; margin-left:-7px; color:var(--acc); font-size:16px; }
#compass .center { position:absolute; left:299px; top:22px; width:2px; height:6px; background:var(--acc); }
#radarwrap { position:absolute; left:24px; top:24px; }
#objp { position:absolute; left:220px; top:30px; max-width:420px; } #objp .h { font-size:11px; letter-spacing:4px; color:var(--acc); } #objp .t { font-size:16px; margin-top:4px; } #objp .c { color:#cfd5da; font-size:13px; margin-top:3px; }
#objp.flash { animation: objflash 1.6s; } @keyframes objflash { 0%,30%,60% { color:var(--acc); transform:translateX(6px); } 100% { transform:none; } }
#waypoint { position:absolute; left:0; top:0; text-align:center; width:60px; margin-left:-30px; margin-top:-20px; }
#waypoint .d { color:var(--acc); font-size:20px; filter: drop-shadow(0 0 4px rgba(0,0,0,.9)); } #waypoint .m { font-size:12px; color:#fff; }
#ammo { position:absolute; right:40px; bottom:34px; text-align:right; }
#ammo .wn { font-size:13px; letter-spacing:3px; color:#cfd5da; }
#ammo .row .mag { font-size:52px; font-weight:800; } #ammo .row .mag.low { color:#ff5a4a; } #ammo .row .res { font-size:20px; color:#cfd5da; margin-left:6px; }
#ammo .mode { font-size:12px; letter-spacing:3px; color:var(--acc); margin-top:-4px; }
#ammo .nades { font-size:12px; letter-spacing:2px; color:#cfd5da; margin-top:8px; display:flex; gap:14px; justify-content:flex-end; }
#hp { position:absolute; left:40px; bottom:40px; width:220px; } #hp .bar { height:4px; background:rgba(255,255,255,.15); } #hp .bar div { height:100%; background:#e9ecef; transition: width .2s; }
#feed { position:absolute; left:50%; top:58%; transform:translateX(-50%); text-align:center; }
#feed .k { font-size:15px; letter-spacing:3px; animation: kf 2.2s forwards; } #feed .k b { color:var(--acc); }
@keyframes kf { 0% { opacity:0; transform:scale(1.4);} 10% { opacity:1; transform:scale(1);} 80% { opacity:1;} 100% { opacity:0; transform:translateY(-14px);} }
#interact { position:absolute; left:50%; top:62%; transform:translateX(-50%); text-align:center; display:none; } #interact .lbl { font-size:16px; letter-spacing:1px; } #interact .bar { width:220px; height:5px; background:rgba(255,255,255,.2); margin:8px auto 0; } #interact .bar div { height:100%; background:var(--acc); }
#toast { position:absolute; left:50%; top:24%; transform:translateX(-50%); font-size:22px; letter-spacing:6px; font-weight:700; color:var(--acc); opacity:0; transition: opacity .4s; white-space:nowrap; }
#pickmsg { position:absolute; right:40px; bottom:190px; text-align:right; } #pickmsg div { font-size:14px; letter-spacing:3px; color:var(--acc); font-weight:700; animation: kf 1.6s forwards; }
#hint { position:absolute; left:50%; bottom:130px; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:10px 18px; font-size:14px; opacity:0; transition:opacity .4s; white-space:nowrap; } #hint b { color:var(--acc); }
#nade { position:absolute; left:0; top:0; display:none; } #nade .ic { width:44px; height:44px; border-radius:50%; background:rgba(200,30,20,.75); display:flex; align-items:center; justify-content:center; font-size:22px; animation: pulse 0.5s infinite; }
#scope { position:absolute; inset:0; display:none; }
#scope .mask { position:absolute; inset:0; background: radial-gradient(circle at 50% 50%, transparent 0, transparent 38vh, rgba(0,0,0,.6) 38.5vh, #000 40vh); }
#scope .lines { position:absolute; inset:0; background:
  linear-gradient(#000,#000) 50% 50%/2px 76vh no-repeat, linear-gradient(#000,#000) 50% 50%/76vh 2px no-repeat,
  linear-gradient(#000,#000) 50% 50%/6px 22vh no-repeat; }
#scope .lines::before { content:""; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px; border-radius:50%; background:#d22; box-shadow:0 0 6px #f44; }
#scope .lines::after { content:""; position:absolute; left:50%; top:50%; width:40vh; height:6px; margin-left:-20vh; margin-top:-3px; background: linear-gradient(90deg,#000 0 30%, transparent 30% 70%, #000 70%); }
#scope .breath { position:absolute; left:50%; bottom:12vh; transform:translateX(-50%); font-size:13px; letter-spacing:3px; color:#ccc; }
#intro { position:absolute; left:60px; bottom:110px; font-family: Consolas, "Courier New", monospace; font-size:15px; color:#d9f0c8; transition: opacity 1.5s; letter-spacing:1px; line-height:1.7; }
#intro .big { font-size:22px; font-weight:700; letter-spacing:4px; color:#fff; }
#fps { position:absolute; right:12px; top:8px; font-size:12px; color:#9f9; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div id="menu"></div>
<div id="boot">LOADING ASSETS…</div>
<!--ASSETS-->

</body>
</html>
